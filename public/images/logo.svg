<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" flood-color="#4f46e5" />
    </filter>
    <filter id="innerDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Glowing Emblem Badge -->
  <rect x="4" y="4" width="72" height="72" rx="20" fill="url(#mainBg)" filter="url(#logoGlow)" />
  <rect x="5.5" y="5.5" width="69" height="69" rx="18.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />

  <!-- Stacked Exam Paper Effect (Back Sheet) -->
  <rect x="25" y="14" width="34" height="46" rx="4" fill="#ffffff" fill-opacity="0.2" transform="rotate(6 42 37)" />

  <!-- Front Main Exam Paper -->
  <g filter="url(#innerDrop)">
    <path d="M22 17C22 14.7909 23.7909 13 26 13H47L58 24V61C58 63.2091 56.2091 65 54 65H26C23.7909 65 22 63.2091 22 61V17Z" fill="url(#sheetGrad)" />
    <!-- Folded Corner -->
    <path d="M47 13V21C47 22.6569 48.3431 24 50 24H58L47 13Z" fill="#cbd5e1" />
  </g>

  <!-- Question Lines & Formulas -->
  <rect x="28" y="24" width="16" height="3.5" rx="1.75" fill="#4f46e5" />
  <rect x="28" y="31.5" width="24" height="3" rx="1.5" fill="#64748b" />
  <rect x="28" y="38" width="18" height="3" rx="1.5" fill="#94a3b8" />
  <rect x="28" y="44.5" width="14" height="2.5" rx="1.25" fill="#cbd5e1" />

  <!-- Success Grade Seal / Badge -->
  <circle cx="46" cy="52" r="10" fill="url(#checkGrad)" filter="url(#innerDrop)" />
  <path d="M42 52L44.8 54.8L50.5 49" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Sparkle of Excellence -->
  <path d="M63 9L64.8 14.2L70 16L64.8 17.8L63 23L61.2 17.8L56 16L61.2 14.2L63 9Z" fill="#fbbf24" />
</svg>
